name: Full Financial P0

on:
  workflow_dispatch:
  push:
    branches:
      - "release/**"
    paths:
      - "contracts/contestation/**"
      - "services/chain/sandbox.mjs"
      - "scripts/run-p0.mjs"
      - "tests/financial-categories.mjs"
      - "tests/financial.sandbox.test.mjs"

permissions:
  contents: read

concurrency:
  group: financial-p0-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  financial-p0:
    name: financial-p0
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Use pinned Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.13.0
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Install pinned NEAR Sandbox binary
        run: node scripts/setup-sandbox.mjs
      - name: Run F01 through F18 without weakened assertions
        shell: bash
        run: |
          set -o pipefail
          if [ "$(ulimit -Sn)" -lt 65535 ]; then ulimit -Sn 65535; fi
          echo "Open-file limits: soft=$(ulimit -Sn) hard=$(ulimit -Hn)"
          npm run test:p0
      - name: Upload complete P0 evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: financial-p0-${{ github.run_id }}
          path: |
            project/artifacts/m03/p0-run/
            project/artifacts/implementation/verification.json
          if-no-files-found: error
          retention-days: 60
