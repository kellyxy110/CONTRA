name: Security CI

on:
  pull_request:
  push:
    branches:
      - "release/**"
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-policy:
    name: security-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out complete history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Use pinned Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.13.0
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install without package lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Secret, restricted-file and source-policy scan
        run: node scripts/ci-policy.mjs security
      - name: Dependency audit against accepted baseline
        run: node scripts/ci-dependency-audit.mjs
      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: security-ci-reports-${{ github.run_id }}
          path: ci-output/
          if-no-files-found: warn
          retention-days: 30
