name: Core CI

on:
  pull_request:
    branches: [main, implementation/oct28]
  push:
    branches:
      - "implementation/**"
      - "ci/**"
      - "feature/**"
      - "release/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-node:
    name: core-node
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Use pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26.13.0
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Clean dependency installation
        run: npm ci --no-audit --no-fund
      - name: Source policy and JavaScript syntax
        run: node scripts/ci-policy.mjs core
      - name: Repository unit and service tests
        run: npm test
      - name: M05 runtime and recovery tests
        run: node --test tests/m05-runtime.test.mjs
      - name: Wallet bundle build
        run: npm run build:wallet
      - name: Retrospective evidence integrity review
        run: node scripts/ci-historical-evidence.mjs
      - name: Upload core reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core-ci-reports-${{ github.run_id }}
          path: ci-output/
          if-no-files-found: warn
          retention-days: 30
