name: Core CI

on:
  pull_request:
    branches: [main, implementation/oct28]
  push:
    branches:
      - "implementation/**"
      - "ci/**"
      - "feature/**"
      - "release/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-node:
    name: core-node
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Use pinned Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.13.0
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Clean dependency installation
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Source policy and JavaScript syntax
        run: node scripts/ci-policy.mjs core
      - name: Documentation links
        run: node scripts/ci-doc-links.mjs
      - name: Documentation impact
        run: node scripts/ci-doc-drift.mjs
      - name: Repository unit and service tests
        run: npm test
      - name: M05 runtime and recovery tests
        run: node --test tests/m05-runtime.test.mjs
      - name: Wallet bundle build
        run: npm run build:wallet
      - name: Cloudflare compatibility and Durable Object regressions
        run: npm run test:cloudflare && npm run check:cloudflare
      - name: Install Chromium for frontend browser verification
        run: npx playwright install --with-deps chromium
      - name: Verify redesigned frontend at five viewport widths
        run: npm run test:browser
      - name: Retrospective evidence integrity review
        run: node scripts/ci-historical-evidence.mjs
      - name: Upload core reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: core-ci-reports-${{ github.run_id }}
          path: ci-output/
          if-no-files-found: warn
          retention-days: 30
