name: Integration CI

on:
  workflow_dispatch:
  push:
    branches:
      - "release/**"
    paths:
      - "contracts/adjudication/**"
      - "services/chain/**"
      - "scripts/run-m04-journeys.mjs"
      - "scripts/sandbox-preflight.mjs"
      - "tests/escrow.sandbox.test.mjs"
  pull_request:
    branches: [main, implementation/oct28]
    paths:
      - ".github/workflows/integration.yml"
      - "contracts/adjudication/**"
      - "services/api/store.mjs"
      - "services/chain/**"
      - "scripts/run-m04-journeys.mjs"
      - "scripts/sandbox-preflight.mjs"
      - "tests/escrow.sandbox.test.mjs"

permissions:
  contents: read

concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sandbox-integration:
    name: sandbox-integration
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Use pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26.13.0
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Build production and fault contracts
        run: node scripts/build-contracts.mjs
      - name: Install pinned NEAR Sandbox binary
        run: node scripts/setup-sandbox.mjs
      - name: Corrected nine-test Sandbox baseline
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-output
          if [ "$(ulimit -Sn)" -lt 65535 ]; then ulimit -Sn 65535; fi
          echo "Open-file limits: soft=$(ulimit -Sn) hard=$(ulimit -Hn)"
          npm run test:sandbox 2>&1 | tee ci-output/sandbox-baseline.txt
      - name: Complete unchallenged and challenged journeys
        shell: bash
        run: |
          set -o pipefail
          if [ "$(ulimit -Sn)" -lt 65535 ]; then ulimit -Sn 65535; fi
          echo "Open-file limits: soft=$(ulimit -Sn) hard=$(ulimit -Hn)"
          npm run test:m04:journeys 2>&1 | tee ci-output/m04-journeys.txt
      - name: Validate fresh receipt and balance report
        run: node scripts/ci-historical-evidence.mjs
      - name: Upload integration evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sandbox-integration-${{ github.run_id }}
          path: |
            ci-output/
            project/artifacts/m04/local-journeys/journey-report.json
            project/artifacts/m04/local-journeys/operations.json
            project/artifacts/m04/local-journeys/receipts.json
          if-no-files-found: warn
          retention-days: 30
